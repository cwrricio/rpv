name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Testes Python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Rodar testes
        env:
          STORAGE_BACKEND: postgres
          DATABASE_URL: sqlite+pysqlite:///:memory:
          PROJECT_ID: test-project
          RTDB_URL: https://test-project-default-rtdb.firebaseio.com
        run: pytest -q --tb=short

  build-image:
    name: Build Docker (backend)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build imagem backend
        run: docker build -f Dockerfile.backend -t poshboard-backend:ci .

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apresentacao/package-lock.json

      - name: Instalar dependências frontend
        working-directory: apresentacao
        run: npm ci

      - name: Build frontend
        working-directory: apresentacao
        env:
          VITE_API_URL: /api
        run: npm run build
