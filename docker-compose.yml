# SSQM — stack portável "Docker em tudo": Postgres + backend FastAPI + frontend.
# Remove a dependência operacional de Firebase Hosting/RTDB para rodar local ou
# em qualquer VPS/Kubernetes/Cloud Run. STORAGE_BACKEND=postgres por padrão aqui.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: poshboard
      POSTGRES_PASSWORD: poshboard
      POSTGRES_DB: poshboard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poshboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      STORAGE_BACKEND: postgres
      DATABASE_URL: postgresql+psycopg://poshboard:poshboard@db:5432/poshboard
      CORS_ORIGINS: http://localhost:8080
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["python", "-m", "functions.jobs.worker", "--poll-interval", "2"]
    environment:
      STORAGE_BACKEND: postgres
      DATABASE_URL: postgresql+psycopg://poshboard:poshboard@db:5432/poshboard
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./apresentacao
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
